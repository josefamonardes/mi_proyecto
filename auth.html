<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TaskFlow · Acceso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <h2 class="mb-4">Acceso a TaskFlow</h2>

    <div class="row">
      <div class="col-md-6 mb-4">
        <h4>Registro</h4>
        <form id="registerForm" class="mb-3">
          <div class="mb-2">
            <label for="reg_username" class="form-label">Usuario</label>
            <input id="reg_username" name="username" class="form-control" required minlength="3" />
          </div>
          <div class="mb-2">
            <label for="reg_email" class="form-label">Email</label>
            <input id="reg_email" name="email" type="email" class="form-control" required />
          </div>
          <div class="mb-2">
            <label for="reg_password" class="form-label">Contraseña</label>
            <input id="reg_password" name="password" type="password" class="form-control" required minlength="8" />
          </div>
          <button class="btn btn-primary" type="submit">Registrar</button>
        </form>
      </div>

      <div class="col-md-6 mb-4">
        <h4>Acceso</h4>
        <form id="loginForm" class="mb-3">
          <div class="mb-2">
            <label for="login_identifier" class="form-label">Usuario o email</label>
            <input id="login_identifier" name="identifier" class="form-control" required />
          </div>
          <div class="mb-2">
            <label for="login_password" class="form-label">Contraseña</label>
            <input id="login_password" name="password" type="password" class="form-control" required />
          </div>
          <button class="btn btn-success" type="submit">Iniciar sesión</button>
        </form>
      </div>
    </div>

    <div class="mt-3">
      <a href="index.html" class="btn btn-link">Volver a la app</a>
    </div>
  </main>

  <!-- Cargar script.js (asegúrate de que está en la misma carpeta) -->
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
