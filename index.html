<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    /* Mantengo algunos estilos inline que estabas usando */
    .bg-gradient-primary {
      background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%) !important;
    }
  </style>
</head>
<body>
  <!-- Navegación -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-check2-circle me-2"></i> TaskFlow
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#"><i class="bi bi-house-door"></i> Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#"><i class="bi bi-list-task"></i> Mis Tareas</a></li>
          <li class="nav-item"><a class="nav-link" href="auth.html"><i class="bi bi-person"></i> Iniciar sesión</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Header/Hero Section -->
  <header class="bg-gradient-primary text-white py-5 mb-5">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-lg-8">
          <h1 class="display-4 fw-bold mb-3">
            <i class="bi bi-check2-all"></i> Organiza Tu Día con TaskFlow
          </h1>
          <p class="lead">Una pequeña app para gestionar tus tareas con filtros, prioridades y persistencia.</p>
        </div>
      </div>
    </div>
  </header>

  <!-- App: se oculta si no está autenticado -->
  <section id="appSection" style="display:none;">
    <div class="container py-3 d-flex justify-content-between align-items-center">
      <div>
        <strong>Bienvenido, <span id="whoami"></span></strong>
      </div>
      <div>
        <button id="logoutBtn" class="btn btn-outline-secondary">Cerrar sesión</button>
      </div>
    </div>

    <div class="container mb-4">
      <!-- Formulario para añadir tareas -->
      <form id="taskForm" class="row g-2 align-items-center mb-3">
        <div class="col-md-6">
          <input id="taskInput" class="form-control" placeholder="Nueva tarea..." required />
        </div>
        <div class="col-md-2">
          <select id="prioritySelect" class="form-select">
            <option value="baja">Baja</option>
            <option value="media" selected>Media</option>
            <option value="alta">Alta</option>
            <option value="urgente">Urgente</option>
          </select>
        </div>
        <div class="col-md-3">
          <input id="taskDueDate" type="datetime-local" class="form-control" />
        </div>
        <div class="col-md-1">
          <button class="btn btn-primary w-100" type="submit">Añadir</button>
        </div>
      </form>

      <!-- Filtros simples -->
      <div class="mb-3">
        <div class="btn-group" role="group" id="filterGroup">
          <button class="btn btn-outline-secondary active" data-filter="all">Todas</button>
          <button class="btn btn-outline-secondary" data-filter="pending">Pendientes</button>
          <button class="btn btn-outline-secondary" data-filter="completed">Completadas</button>
          <button class="btn btn-outline-secondary" data-filter="urgent">Urgentes</button>
        </div>
      </div>

      <!-- Lista de tareas -->
      <div id="tasksList" class="list-group"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container">
      <div class="text-center text-muted">
        <small>© 2024 TaskFlow. Proyecto desarrollado para Ingeniería Web 1 - UAX.</small>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Inicialización extra (fecha mínima en input de fecha) -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const dueDateInput = document.getElementById('taskDueDate');
      if (dueDateInput) {
        const now = new Date();
        const formattedDate = now.toISOString().slice(0, 16);
        dueDateInput.min = formattedDate;
        // por defecto: mañana medio día
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        tomorrow.setHours(12,0,0,0);
        dueDateInput.value = tomorrow.toISOString().slice(0,16);
      }
    });
  </script>
</body>
</html>
